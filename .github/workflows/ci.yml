name: CI

# Lint and the full suite on every push and pull request, on Linux only, as
# the apps do. Two Pythons: 3.14 is what the apps ship, 3.12 is the oldest
# pyproject.toml accepts. The suite runs twice per Python, offscreen and with
# no fonts (minimal), because pixel tests must pass both ways; it takes about
# a second. A push that only touches Markdown has nothing to test. GitHub
# judges that by the pushed commits, and the first push of a branch can look
# Markdown-only when its newest commit is (the repo's first push did), so CI
# can also be run by hand: gh workflow run CI.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      # Qt loads these even for the offscreen platform the tests use.
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0

      # Editable, so the pyinstaller40 entry point is registered (test_packaging).
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt -e .

      - name: Lint
        run: python -m ruff check src tests

      - name: Tests (offscreen)
        run: python -m pytest -q -rs

      - name: Tests (no fonts)
        env:
          QT_QPA_PLATFORM: minimal
        run: python -m pytest -q -rs
